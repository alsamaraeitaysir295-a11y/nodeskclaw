[project]
name = "nodeskclaw-backend"
version = "0.1.0"
description = "NoDeskClaw - K8s visual management console for DeskClaw"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    # Database (PostgreSQL)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # HTTP client (飞书 SSO)
    "httpx>=0.28.0",
    # Config
    "pydantic-settings>=2.7.0",
    # Email validation (for EmailStr)
    "email-validator>=2.1.0",
    # Encryption (KubeConfig AES-256-GCM)
    "cryptography>=44.0.0",
    # K8s
    "kubernetes-asyncio>=31.1.0",
    "pyyaml>=6.0.3",
    "croniter>=6.0.0",
    "lark-oapi>=1.5.3",
    # Email (SMTP)
    "aiosmtplib>=3.0.0",
    # Object Storage (S3 compatible)
    "boto3>=1.35.0",
    # Database migrations
    "alembic>=1.13.0",
    # JSON Schema 校验（任务空间编排器拆解输出校验，设计 §4）
    "jsonschema>=4.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "UP017", "I001", "UP042", "F401", "F841", "E702", "UP035", "UP041", "UP046", "F541", "N818"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio 1.x 起，覆盖 event_loop fixture 的旧写法失效；
# 需要同时声明 fixture 级和测试级事件循环作用域为 session，
# 使整个测试会话共用一个事件循环，与 tests/conftest.py 中模块级单例
# engine（asyncpg 连接池）绑定的事件循环保持一致，
# 避免"另一操作正在进行"/跨事件循环 Future 错误
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
